# =============================================================================
# Model hyperparameters and prior scales
# =============================================================================
# Everything the model does numerically is specified here. No magic numbers in
# the Python.
#
# UNITS. The model works throughout in the LOGIT of the Democratic share of the
# two-party vote. Useful conversions near a 50-50 race:
#     d(logit)/d(share) = 1 / (p(1-p)) = 4      at p = 0.5
#     1 point of SHARE  ~ 0.04 logit
#     1 point of MARGIN ~ 0.02 logit            (margin = 2 x share deviation)
# So a prior SD of 0.10 logit is roughly "5 points of margin".
# =============================================================================

# --- National reference points ----------------------------------------------
# Two-party Democratic share of the NATIONAL presidential vote. Used to convert
# each state's raw presidential share into a partisan *lean* relative to the
# nation, so that the race baseline is defined under a neutral (50-50) national
# environment and the national environment enters separately via generic-ballot
# polls. Without this recentering the fundamentals prior and the national
# environment term would double-count the national swing.
national:
  pres_2024_dem_two_party: 0.4924   # Harris 48.3 / Trump 49.8
  pres_2020_dem_two_party: 0.5229   # Biden  51.3 / Trump 46.8

# --- Fundamentals prior ------------------------------------------------------
# Predicts each race's baseline logit share under a NEUTRAL national
# environment:
#
#   f_r = shrink * (w2024 * lean2024_r + w2020 * lean2020_r) + incumbency_r
#
# where lean is the state's presidential logit share minus the national one.
fundamentals:
  weight_pres_2024: 0.75
  weight_pres_2020: 0.25
  # Senate results are slightly less polarised than presidential results;
  # <1 shrinks safe states back toward the centre.
  lean_shrinkage: 0.95
  # Incumbency advantage, in logit units, signed toward the incumbent's party.
  # ~0.06 logit = ~3 points of margin, consistent with the modern (post-2016)
  # decline in the personal-incumbency advantage.
  incumbency_bonus:
    elected: 0.060
    appointed: 0.020
    open: 0.0
  # How far a race may sit from its fundamentals prediction. Wide on purpose:
  # ~0.15 logit = ~7.5 points of margin. In well-polled races the polls
  # dominate this prior; in unpolled races it is what carries the forecast.
  prior_sd: 0.15

# --- Latent state: national environment --------------------------------------
# eta_t = national two-party Democratic logit share (generic ballot), modelled
# as a Gaussian random walk on a daily grid. eta_t = 0 means a tied generic
# ballot.
national_environment:
  # Half-normal prior scale on the per-day innovation SD. 0.004/day accumulates
  # to 0.004*sqrt(365) ~ 0.076 logit (~3.8 pts of margin) of drift over a year,
  # which is the right order for generic-ballot movement.
  rw_sd_per_day_prior: 0.004
  # Prior on the environment at the start of the window.
  initial_sd: 0.10
  # Presidential approval as a SECOND indicator of the national environment.
  #
  # What this does: approval gets its own latent random walk, and its
  # innovations are correlated with the generic ballot's by a coefficient the
  # model estimates. When approval moves, the environment is nudged to move
  # with it, in proportion to how tightly the two have actually co-moved. Only
  # movement is shared — approval's *level* is absorbed by its own intercept,
  # because "net approval of -8" does not translate into a generic-ballot
  # margin without a historical fit this dataset cannot support (VoteHub's
  # approval series starts in 2018, which is two midterms).
  #
  # What it does NOT do: fix staleness. Approval polls in this feed end
  # 2026-06-29 and generic-ballot polls 2026-06-30, so both are about seven
  # weeks behind the state polls. Approval adds information over the window
  # where it exists; it does not extend the window.
  approval:
    # MEASURED AND TURNED OFF. Built, A/B-tested against the same polls, and
    # left disabled because the numbers did not justify it:
    #
    #   national-environment 90% width : 3.95 vs 4.23 pts  (only 6.6% tighter)
    #   minimum effective sample size  : 296  vs 455       (35% worse)
    #   P(Democratic control)          : 60.7% vs 62.9%
    #
    # An ESS of 296 is below the 400 floor this project treats as the bar for a
    # trustworthy run and surfaces on the dashboard, so the cost is real while
    # the gain is marginal. The mechanism is sound — the fitted correlation
    # between approval and generic-ballot innovations came out at -0.54
    # [-0.89, -0.04], correctly negative, since eta is the *Democratic* share
    # and approval is the *president's* — it simply is not worth the geometry.
    #
    # Set to true to re-enable; `scripts/ab_approval.py` reproduces the test.
    enabled: false
    rw_sd_per_day_prior: 0.004
    initial_sd: 0.30
    # Prior scale on atanh(correlation) between the two series' innovations.
    # 0.6 puts most mass on a positive but far-from-perfect correlation.
    correlation_prior_sd: 0.6

# --- Latent state: per-race ---------------------------------------------------
# theta_{r,t} = alpha_r + lambda_r * eta_t + epsilon_{r,t}
#   alpha_r      race baseline under a neutral environment (fundamentals prior)
#   lambda_r     sensitivity of the race to the national environment
#                ("elasticity"), partially pooled around 1
#   epsilon_{r,t} race-specific random walk capturing idiosyncratic movement
#                (candidate news, ad spending, scandals)
race:
  elasticity_mean: 1.0
  elasticity_sd: 0.25          # partial pooling around 1
  elasticity_lower: 0.2        # keep sign-identified and away from 0
  # FITTED. `midterms calibrate` separates genuine opinion movement from
  # systematic polling error by comparing poll accuracy at different horizons:
  # error against the final result falls from 6.45 points at 45-120 days out to
  # 5.12 at 0-14 days. What shrinks is drift; what remains is the systematic
  # miss. That works out at 0.009 logit per day.
  #
  # This was 0.005, and the walk it produced drifted only 1.85 points over 70
  # days against 3.9 historically — far too rigid. The election-day error was
  # silently covering the difference, which meant the forecast would have been
  # just as uncertain three days out as three months out.
  #
  # Given as the MEDIAN of a lognormal rather than the scale of a half-normal.
  # A half-normal has its mode at zero and lets a quiet couple of months talk
  # the model into believing races no longer move, which is exactly what
  # happened. History says they move; the data can revise that, not ignore it.
  rw_sd_per_day_prior: 0.009
  # Movement is CORRELATED across similar races, not independent.
  #
  # Treating each race's drift as i.i.d. says that Michigan moving three points
  # toward Democrats tells you nothing about Wisconsin. That is plainly wrong,
  # and it is most costly exactly where the model is weakest: the 14 races with
  # no polling at all, which under independence can only drift on their prior.
  # Correlating the innovations lets a poll in one state inform its neighbours.
  #
  # Same kernel shape as the election-day error, with its own length scale —
  # week-to-week co-movement is broader than election-day error correlation.
  #
  # This does compete with the national environment for the common signal: a
  # perfectly correlated drift is indistinguishable from a move in eta. It stays
  # identified because eta has its own likelihood terms (the generic-ballot
  # polls observe it directly), and because this kernel decays with distance
  # rather than being all-ones. Convergence is checked on every run.
  movement_correlation:
    length_scale: 1.5
    region_weight: 0.5
    nugget: 0.05

# --- Measurement model (polls) ------------------------------------------------
polls:
  # Student-t likelihood so a single wild poll cannot drag the latent state.
  student_t_nu: 5.0
  # Rescale so the likelihood's STANDARD DEVIATION is the one we asked for.
  #
  # A Student-t's SD is its scale x sqrt(nu / (nu - 2)) — 1.41x at nu=4. Feeding
  # the sampling SD in as the scale therefore inflated every poll's effective
  # error by 41% on top of the design effect, which is why the model's per-poll
  # spread came out near 7 points of margin against a measured 4.0, and why the
  # backtest found 50% intervals containing 70% of held-out polls. Dividing the
  # scale by that factor keeps the heavy tails (the reason for using t at all)
  # without the variance inflation that came along with them.
  match_student_t_variance: true
  # Sampling variance on the logit scale via the delta method:
  #   var = design_effect / (n * p * (1-p))
  #
  # FITTED, not assumed. `midterms calibrate` compares the observed spread of
  # polls within a race against the binomial spread their sample sizes imply,
  # over 595 Senate polls from 2010-2022 taken 45-120 days out. The excess is
  # 1.18x, not the 1.5 previously assumed.
  #
  # Mildly conservative on purpose: the measured 1.18 also contains house
  # effects and real opinion movement inside the window, both of which the model
  # represents separately, so the true sampling-only design effect is lower
  # still. Erring high here costs a little sharpness; erring low would make
  # every individual poll too influential.
  design_effect: 1.18
  # Poll noise that a bigger sample does not buy away.
  #
  # FITTED, and it corrects a real defect. Sampling theory says poll error
  # shrinks as 1/sqrt(n). Measured on 3,056 historical polls, within-race
  # scatter scales as n^-0.18, nowhere near n^-0.5: house effects, mode,
  # likely-voter modelling and question wording contribute error that is the
  # same size whatever the sample. Roughly 2.2 points of it, near-constant in n.
  #
  # Weighting purely by 1/n therefore treated a 2,000-person poll as about 1.6x
  # more precise than history says it is. This term is what stops that.
  #
  # Lognormal median, not a half-normal scale. Under a half-normal the
  # posterior collapsed to 0.13 points — the house effects and the Student-t
  # tails could absorb the scatter, so nothing held this term up, and large
  # polls kept their inflated weight.
  excess_sd_prior: 0.0435
  # Pollster house effects, hierarchical and SUM-TO-ZERO constrained. Without
  # the constraint the house effects and the latent state are not jointly
  # identified (you can add a constant to every house effect and subtract it
  # from the state).
  house_effect_sd_prior: 0.06
  # A pollster needs at least this many polls in the window to earn its own
  # house effect; the rest share a single pooled effect.
  #
  # This matters more than it looks. Most pollsters in the feed appear once or
  # twice. Give each of them a free parameter and it will absorb that poll's
  # entire deviation from the latent state, which (a) is not a *house* effect,
  # it is noise, and (b) drives the estimated excess poll error to zero, which
  # in turn makes every single poll far too influential. Pooling the long tail
  # sends their deviation where it belongs: into excess_sd.
  min_polls_for_house_effect: 3
  # Pollster quality weighting, from FiveThirtyEight's pollster ratings.
  #
  # The model learns each pollster's BIAS from the data, as a house effect. It
  # cannot learn each pollster's PRECISION, because most pollsters have far too
  # few polls in one cycle to estimate a variance from. Without this, an F-rated
  # shop and an A+ shop differ only by sample size — which is exactly the
  # mistake that trusting sample size alone invites.
  #
  # The multiplier scales `excess_sd_prior` only, not the sampling term: 538's
  # plus-minus already measures error BEYOND what sample size explains, which is
  # the same quantity excess_sd_prior represents.
  #
  # Multipliers are centred so their poll-weighted mean is exactly 1.0.
  # excess_sd_prior was fitted against all historical polls, so it already
  # describes an average pollster; raw ratings average +0.49 points rather than
  # zero, and applying them uncentred would inflate every poll's noise and
  # quietly undo that calibration. Centred, the ratings redistribute trust
  # without changing its total.
  #
  # Unrated pollsters get exactly 1.0. 538 stopped updating in 2025, so the 2026
  # entrants cannot be rated. Treating them as average is generous — a pollster
  # with no track record is riskier than one with a good one — but a penalty
  # would be a number nothing measured. The count is logged each run.
  pollster_ratings:
    enabled: true
    # Drop pollsters 538 refused to accept polls from. The list exists mainly
    # for suspected data fabrication, and fabricated data cannot be down-weighted
    # into usefulness — a plausible invented number looks precise, not noisy.
    # Currently excludes Big Data Poll (generic-ballot and approval only; no
    # Senate race polls). Set false to keep them, weighted by their rating.
    exclude_banned: true
  # Population/screen adjustments, relative to likely voters (the reference).
  # Registered-voter and adult samples historically lean slightly more
  # Democratic than likely-voter samples.
  population_effect_sd_prior: 0.03
  population_reference: lv
  # Partisan-sponsor adjustment. Applied as rho * s_i where s_i is +1 for a
  # Democratic-aligned sponsor, -1 for Republican-aligned, 0 for neutral.
  # rho is constrained positive (partisan polls favour their sponsor) and
  # shrunk toward zero.
  partisan_effect_prior: 0.08
  # Polls older than this are dropped entirely.
  max_age_days: 400
  # Minimum sample size to accept a poll.
  min_sample_size: 100
  # Sample size used when a poll reports none.
  default_sample_size: 600

# --- Election-day error -------------------------------------------------------
# Applied at SIMULATION time, on top of the posterior latent state. This is the
# part that makes the seat distribution honest: polls are not just noisy, they
# are *correlated-ly wrong*. Two components:
#   national  a common miss across every race (e.g. a systematic turnout or
#             differential-nonresponse error)
#   state     a correlated-across-similar-states miss, with correlation decaying
#             in political distance between states
# Scales are set so total error ~ sqrt(0.075^2 + 0.085^2) = 0.113 logit
# ~ 5.7 points of margin RMSE, matching the historical record for Senate polling
# at this distance from an election.
election_day_error:
  # FITTED from 167 historical Senate races (2010-2022), 45-120 days out, via
  # `midterms calibrate`. Previously asserted from the literature as 0.075 and
  # 0.085, which understated total race-level error by 14% and — more
  # importantly — mis-split it, overstating the perfectly-correlated national
  # component by 20% while understating the race-specific one by 34%.
  #
  # The split matters as much as the total. National error moves all 35 races
  # together and so fattens the tails of the seat distribution; state error
  # partly cancels across the map. Getting the mix wrong changes the shape of
  # the chamber forecast without changing any single race's win probability.
  # Fitted at 0-14 days before the election, NOT at the forecast horizon.
  #
  # This is the systematic miss the polls were always going to make, with drift
  # stripped out — drift now lives in the random walk, where it belongs and
  # where it grows with the time remaining. Fitting these at 45-120 days folded
  # roughly 3.9 points of drift in here, which made the total about right today
  # while guaranteeing it stayed just as wide on the eve of the election.
  #
  # Note the national component barely moves with horizon (3.27 at 0-14 days,
  # 2.99 at 45-120) while the state component grows from 3.94 to 5.71. That is
  # the signature of the split: national error is systematic, state-level error
  # is mostly races actually moving.
  national_sd: 0.065    # 3.3 points of margin
  state_sd: 0.079       # 3.9 points of margin
  # Correlation kernel: corr(r, r') = (1 - nugget) * exp(-d(r,r') / length_scale)
  # with d the Euclidean distance in standardised covariate space
  # (2024 lean, 2020 lean, region indicator).
  correlation:
    length_scale: 1.25
    region_weight: 0.6      # how much sharing a region pulls states together
    nugget: 0.02            # keeps the matrix comfortably positive-definite
  #
  # NOTE: there is deliberately no separate "drift to election day" term here.
  # The latent random walks are defined on a grid whose final point IS election
  # day, so uncertainty about movement between the last poll and the election is
  # already carried by the fitted walk. Adding a drift term on top would
  # double-count it and inflate every interval.

# --- Sampler ------------------------------------------------------------------
sampler:
  draws: 1000
  # Generous tuning: the variance-scale parameters (sigma_eps, sigma_eta) sit
  # near zero, where the posterior geometry is tightest and the step-size
  # adaptation needs the most warm-up.
  tune: 1500
  chains: 4
  target_accept: 0.95
  seed: 20261103
  # "nutpie" (Numba) avoids needing a C++ compiler on Windows and is faster.
  # "pymc" falls back to the built-in NUTS.
  backend: nutpie

# --- Simulation ---------------------------------------------------------------
simulation:
  # Posterior draws are recycled this many times with fresh election-day error
  # to build a smooth seat distribution.
  sims_per_draw: 10

# --- Time grid ----------------------------------------------------------------
time:
  # Resolution of the latent random walks, in days. The grid is anchored
  # backwards from election day so the forecast target is an exact grid point.
  # Each poll is assigned to its nearest grid point; at 7 days the worst-case
  # snapping error is 3.5 days, far below the week-to-week noise in the polls.
  grid_days: 7

# --- Per-chamber overrides ----------------------------------------------------
#
# Everything above is the Senate's, fitted from Senate polling. Applying those
# numbers to 435 House districts was never a decision anyone took -- it was what
# happened when the House was added to a model that had only ever had one
# chamber. These are the same quantities measured on the House's own history.
#
# Fitted by `midterms calibrate --chamber house`, on House-G polls 0-14 days out
# from 2010, exactly as the Senate block above was. Merged leaf by leaf, so the
# correlation kernel and everything else stay shared.
#
# WHAT CHANGED, AND WHICH WAY
#
#   national_sd    3.32 -> 3.78 pts   House cycle-wide misses are larger
#   state_sd       3.96 -> 4.61 pts   districts miss by more than states
#   design_effect  1.18 -> 1.04       House polls are noisier, but only because
#                                     they are smaller (median n 496 vs 735)
#
# The first two WIDEN the seat interval. That is the honest direction and it is
# worth saying plainly, because the interval was already the thing that looked
# too wide: measured against 13 cycles of generic-ballot error, the model's
# national uncertainty (3.42 points including latent drift) matches the observed
# RMSE about zero (3.46) almost exactly. The width is real.
#
# The design effect goes the other way. It is a ratio of observed spread to what
# the sample size predicts, so it is already net of sample size: House polls
# carry 5.85 points of raw noise against the Senate's 3.97, but at a median n of
# 496 against 735 that is very nearly all the smaller samples, which the
# sampling-variance term knows about on its own. Carrying the Senate's 1.18 was
# inflating district poll variance by 13% and discounting the only direct
# evidence 38 districts have.
#
# NOTE THE WINDOW IS DIFFERENT HERE, deliberately, and matches how the Senate's
# 1.18 was set: the design effect is fitted at 45-120 days, where the model
# actually runs and where poll-to-poll spread is the thing being described,
# while the election-day scales are fitted at 0-14 days to keep drift out of
# them. Fitting the design effect at 0-14 days instead gives 0.95, and mixing
# the two bases would have made the House and Senate figures incomparable.
#
# NOT CHANGED: the correlation kernel. Its region contrast (+0.230 after the
# same demeaning the measurement needs) sits inside the 90% bootstrap interval
# for both chambers -- House measured +0.088 [+0.035, +0.284], Senate +0.167
# [+0.047, +0.490]. Seven cycles cannot separate them, and shrinking it on a
# point estimate is the exact trap documented in scripts/fit_correlation.py.
chambers:
  house:
    election_day_error:
      national_sd: 0.0756   # 3.78 points of margin
      state_sd: 0.0922      # 4.61 points of margin
    polls:
      design_effect: 1.04
    national_environment:
      # The generic ballot is not the national House vote, and the gap is
      # measurable. Fitted by `midterms calibrate --chamber house`, which reports
      # it, on House-G-US polls 0-14 days out from 2010: the generic ballot ran
      # +1.65 points more Democratic than the vote actually cast, se 0.94.
      #
      # THIS IS THE INSTRUMENT, NOT THE POLLSTERS. Across the same cycles,
      # race-level polls show no such bias -- House districts +0.30, Senate
      # +0.29, governors +0.52, every one inside its own standard error. Only
      # the generic ballot is off. "Which party would you vote for in Congress"
      # is not the votes that get cast: hundreds of seats are uncontested or
      # nearly so, and turnout differs between safe and marginal districts.
      #
      # WHY 2010 AND NOT ALL THIRTEEN CYCLES. The bias has a regime change:
      #
      #     1998-2006   +3.8 +3.2 +4.8 +4.5 +5.5           mean +4.36
      #     2008-2022   -1.2 -0.1 -1.1 +3.7 +3.6 -1.3
      #                 +4.7 +2.0                          mean +1.29
      #
      # Welch's t on that decline is 3.14, p = 0.011. Fitting all thirteen gives
      # +2.47 and would import a regime that ended two decades ago. 2010 is the
      # cutoff every other calibration in this file uses.
      #
      # IT IS THIN EVIDENCE AND IS TREATED AS SUCH. +1.65 with se 0.94 does not
      # clear a conventional significance bar. That argues for carrying the
      # uncertainty -- which `generic_ballot_bias_se` does, widening the
      # election-day error -- not for setting it to zero. Zero is also an
      # estimate, and one the data likes less. Set both to 0.0 to disable.
      generic_ballot_bias: 0.0330      # +1.65 points of margin
      generic_ballot_bias_se: 0.0188   #  0.94 points
