name: Daily forecast

# Refits the model against the latest polling, regenerates the dashboard data
# and the day-over-day commentary, commits the result, and redeploys Pages.
#
# The commit step matters more than it looks: `outputs/runs/<date>/forecast.json`
# is what the next run diffs against to write its commentary, and
# `site/data/history.json` is the trend line. Without persisting them, every run
# would believe it was the first.
#
# Both chambers are refit here, Senate first. The House is the expensive one and
# is deliberately allowed to fail without taking the Senate down with it -- see
# the comment on its step.
#
# The House candidate roster is rebuilt from FEC filings before either model
# runs. It used to be a hand-run script, and went three months without being
# re-run while the poll feed grew from 40 districts to 66; the `roster-freshness`
# job at the bottom exists so that cannot happen quietly again.

on:
  schedule:
    # 11:00 UTC — after most pollsters have published for the day in the US.
    # Cron on GitHub Actions is best-effort and can be delayed under load.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Run the model and commit, but do not deploy to Pages"
        type: boolean
        default: false

permissions:
  contents: write      # commit regenerated forecast data
  # Pages permissions are granted per-job on the `deploy` call below, which is
  # where publishing actually happens; kept here too because a reusable
  # workflow cannot be granted more than its caller holds.
  pages: write         # deploy the dashboard
  id-token: write      # required by the Pages deployment

# Never let two runs fight over the same commit or deployment.
concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the commit step can push cleanly.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      # The roster is the join between a poll's bare candidate names and a side
      # of the ballot, and without it a district's polls are dropped. It was
      # generated once, by hand, when 40 districts were polled; by October the
      # feed had 66 and the roster had never been rebuilt. That cost the House
      # 27 districts and 44 polls -- every one of them sitting in the feed,
      # rejected as "no single D-vs-R matchup" because neither name was known.
      # Nothing failed and nothing warned: the audit step below printed the
      # names every day and nobody was reading the log.
      #
      # So it is rebuilt here, before anything reads it. Party comes from each
      # candidate's own FEC filing, and a name that matches no filing stays
      # unclassified rather than being guessed at.
      #
      # continue-on-error because an FEC outage must not cost a forecast: the
      # script writes only after both fetches succeed, so a failure here leaves
      # yesterday's committed roster in place and the run continues on it.
      - name: Rebuild the House candidate roster from FEC filings
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/build_house_roster.py

      - name: Check the candidate roster still covers the feed
        # Non-fatal: a new nominee means some polls are skipped, which we want
        # surfaced in the log, but it must not stop the forecast from running.
        continue-on-error: true
        run: |
          python -m midterms.cli audit-roster --chamber senate
          python -m midterms.cli audit-roster --chamber house

      # Nothing automated was watching for this. The live-feed duplicate test
      # skips in CI -- raw snapshots are gitignored, so there is none to read --
      # and this command was never run by the schedule. A firm that started
      # filing under a second name would therefore split its house effect in
      # production with no test failing and nothing in any log.
      #
      # Saint Anselm did exactly that and was caught only because a developer
      # happened to run the tests right after an online fetch.
      - name: Check for pollsters filing under more than one name
        continue-on-error: true
        run: python -m midterms.cli audit-pollsters

      # Prediction-market odds, shown next to the forecast and never fed into
      # it. Before the model runs, so the payload can include them; allowed to
      # fail, because a market outage must not stop a forecast publishing.
      # Runs here rather than locally because Polymarket is DNS-blocked in some
      # jurisdictions, including the one this project is developed in.
      - name: Snapshot prediction-market odds
        continue-on-error: true
        run: python -m midterms.cli fetch-markets

      - name: Run the Senate forecast
        env:
          # We sample with nutpie (Numba); the PyTensor C backend is unused.
          PYTENSOR_FLAGS: "cxx="
        run: python -m midterms.cli run --quiet-sampler --chamber senate

      # The House is twelve times the Senate's work -- 435 races against 35, and
      # about 700 seconds of sampling on a developer machine with many cores
      # against the sixty the Senate takes. On a four-core runner it will be
      # slower still, and how much slower is not yet measured.
      #
      # So it is allowed to fail. The Senate forecast is already written by the
      # time this runs and the commit step below stages whatever exists, so a
      # House run that overruns costs the reader a stale House tab rather than a
      # missing dashboard. Same reasoning as the market snapshot above.
      #
      # If it proves reliably fast, fold this guard away. If it proves reliably
      # slow, split it into its own scheduled workflow rather than raising the
      # ceiling again.
      - name: Run the House forecast
        continue-on-error: true
        timeout-minutes: 60
        env:
          PYTENSOR_FLAGS: "cxx="
        run: python -m midterms.cli run --quiet-sampler --chamber house

      # The standing calibration question, answered a few polls at a time.
      #
      # Runs after the forecasts because it needs the poll snapshot they fetch.
      # That ordering is safe, and the reason is worth stating: it scores
      # against the most recent archived run from *strictly before today*, so
      # today's own run -- fitted on exactly these polls -- is excluded by date
      # and cannot be mistaken for an out-of-sample predictor.
      #
      # continue-on-error because this is a diagnostic; losing a day of
      # calibration rows must never cost a forecast.
      - name: Score yesterday's forecast against today's new polls
        continue-on-error: true
        timeout-minutes: 10
        run: |
          for chamber in senate house; do
            python -m midterms.cli calibrate-forward --chamber "$chamber" || true
          done

      # The one measurement that matters, and the only one that cannot be
      # repeated. It reads the chamber totals off Wikipedia's 2026 articles and
      # prints nothing but "no result yet" until November -- which is the point:
      # nobody has to remember to run it on the night, and by the time it
      # matters it will have been exercised every day for weeks.
      #
      # continue-on-error because a wiki being slow must never cost a forecast.
      - name: Score against the result, if there is one yet
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p outputs/score
          for chamber in senate house; do
            python -m midterms.cli score --chamber "$chamber" \
              | tee "outputs/score/$chamber.txt"
          done

      - name: Commit regenerated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Every chamber's outputs, plus the cartogram layout, which the House
          # run regenerates so the squares can never fall out of step with the
          # districts they stand for. Globbed rather than listed by name so a
          # House run that did not finish stages nothing, instead of failing the
          # step on a path that is not there.
          git add site/data/forecast*.json \
                  site/data/history*.json \
                  site/data/commentary*.json \
                  site/data/us-districts.json \
                  outputs/runs \
                  CHANGELOG.md
          # Rebuilt from FEC filings above, so it changes whenever someone files
          # or a pollster tests a district for the first time.
          git add config/candidates_house_2026.yaml || true
          # The pipeline health report each run writes. Committed because the
          # next run diffs its coverage against it, and because a fault should
          # land in a diff rather than only in a log.
          git add outputs/health || true
          # The forward-calibration rows, which only grow.
          git add data/calibration || true
          # Empty until election night, then the scorecard -- committed so the
          # result lands in a diff rather than only in a CI log nobody reads.
          git add outputs/score || true
          git add CHANGELOG_house.md || true
          # Forced: data/raw is gitignored for poll snapshots, which are large
          # and regenerable. This one is small and is the only copy readers can
          # be served from, since Polymarket is unreachable from the machine
          # this project is developed on.
          git add -f data/raw/markets-*.json || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Forecast update $(date -u +%Y-%m-%d)"
            # Another run may have landed while we were sampling.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
  # The rebuild step is continue-on-error, which closes one hole and opens a
  # smaller one: if the FEC or the poll feed is unreachable for a week, the
  # roster silently goes stale again and the run stays green -- exactly the
  # state this change was made to get out of.
  #
  # So this job is allowed to fail, because failing is the entire point: a
  # failed job is the only thing here that reaches a person. It is a job rather
  # than a step for the same reason it is not `continue-on-error`: a step that
  # fails takes the job with it, and `deploy` needs the job, so a stale roster
  # would have taken the whole dashboard off the air. It is the wrong trade --
  # a stale roster costs accuracy, not the site.
  #
  # It therefore runs beside `deploy`, not before it, and checks out the branch
  # head so it reads the roster the forecast job just committed.
  roster-freshness:
    needs: forecast
    if: ${{ always() && needs.forecast.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Fail if the House roster has gone stale
        run: |
          built=$(sed -n 's/^# built: //p' config/candidates_house_2026.yaml | head -1)
          if [ -z "$built" ]; then
            echo "::error::config/candidates_house_2026.yaml has no build stamp."
            exit 1
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$built" +%s) ) / 86400 ))
          echo "roster built $built ($age days ago)"
          if [ "$age" -gt 7 ]; then
            echo "::error::The House candidate roster was last rebuilt $built, $age days ago. The rebuild step has been failing silently, so any district polled for the first time since then has every poll rejected as having no D-vs-R matchup, and the House is forecast on less data than the feed holds."
            exit 1
          fi

  # Whether the data reaching the model looked like data, as opposed to
  # whether the model ran. Every other check in this repository tests the
  # second; the defects have all been in the first, and they all looked like
  # success -- see the docstring on src/midterms/health.py for the list.
  #
  # A job rather than a step, for the reason the roster-freshness job is one:
  # a failing step takes the forecast job with it and `deploy` needs that job,
  # so a data fault would take the dashboard off the air. It should not. A
  # stale or thin forecast is worth publishing; it is just also worth an email.
  pipeline-health:
    needs: forecast
    if: ${{ always() && needs.forecast.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Fail if a pipeline health check did not pass
        run: |
          status=0
          for chamber in senate house; do
            report="outputs/health/$chamber.json"
            if [ ! -f "$report" ]; then
              echo "::warning::no health report for $chamber; its forecast may not have run"
              continue
            fi
            python - "$report" "$chamber" <<'PY' || status=1
          import json, sys
          report, chamber = json.load(open(sys.argv[1], encoding="utf-8")), sys.argv[2]
          bad = [c for c in report["checks"] if not c["ok"]]
          for c in bad:
              print(f"::error title=Pipeline health ({chamber})::"
                    f"{c['name']}: {c['detail']} -- guards against {c['guards']}")
          m = report["metrics"]
          print(f"{chamber}: {m['races_with_polls']}/{m['races_total']} races polled, "
                f"{m['race_polls']} race polls, "
                f"{m['races_blocked_by_roster']} blocked by the roster")
          sys.exit(1 if bad else 0)
          PY
          done
          exit $status

  # Publishing lives in deploy.yml, shared with CI, so the two paths cannot
  # drift apart. It checks out the branch head rather than this run's SHA,
  # which matters here: the commit step above has just added today's data, and
  # a SHA-pinned checkout would publish the site as it was before that.
  deploy:
    needs: forecast
    if: ${{ !inputs.skip_deploy }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
