# =============================================================================
# 2026 U.S. Senate — candidate → party roster
# =============================================================================
# WHY THIS FILE EXISTS
# The VoteHub API returns poll answers as bare candidate names with no party
# attached (`{"choice": "Jon Ossoff", "pct": 47.7}`). To reduce a poll to a
# two-party Democratic share we must know which name is the Democrat and which
# is the Republican. There is no way to infer this from the feed, so it is
# stated explicitly here.
#
# FAIL-CLOSED BY DESIGN
# Ingestion never guesses. A poll is used only if exactly one D-side and one
# R-side candidate can be identified among its answers. Any unrecognised name
# is recorded as `other`, is excluded from the two-party denominator, and is
# reported by the audit command. A race whose polls are all unusable simply
# falls back to its fundamentals prior — which is correct behaviour, not a bug.
#
# MAINTAINING IT
#   python -m midterms.cli audit-roster
# lists every candidate name appearing in the current feed that this file does
# not classify. Run it after a primary; add the new nominees; re-run.
#
# Names marked `other` below are minor-party or unidentified candidates. Where
# a candidate's party could not be confirmed, they are deliberately left in
# `other` rather than guessed: a wrong party assignment corrupts the two-party
# share, whereas `other` merely discards information.
# =============================================================================

# Generic placeholders used by pollsters testing an unnamed nominee.
generic_labels:
  # Presidential-approval polls are reduced with exactly the same two-party
  # machinery as a horse race: Approve takes the "D" slot, Disapprove the "R"
  # slot, and the result is the approve share of approve+disapprove. The labels
  # are arbitrary; only the ratio is used, and only its *movement* reaches the
  # model.
  Approve: D
  Disapprove: R
  Dem: D
  Democrat: D
  Democratic: D
  Rep: R
  Republican: R
  GOP: R

# Misspellings observed in the live feed, normalised before lookup.
aliases:
  "Dan Sullvian": "Dan Sullivan"
  "Thom Thillis": "Thom Tillis"
  "John E. Sununu": "John Sununu"
  "Ben Ray Lujan": "Ben Ray Luján"

