name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest ruff

      - name: Lint
        # scripts/ and .github/scripts/ are linted too: check_palette.py runs
        # inside the test suite and verify_site.py gates every deployment, so a
        # lint error in either is a broken build, not a tidiness question.
        run: ruff check src tests scripts .github

      - name: Tests
        env:
          PYTENSOR_FLAGS: "cxx="
        run: pytest -q

  # Publish on every push to main, not only after the daily model run. Before
  # this, deployment lived solely in daily-forecast.yml, so a front-end fix
  # merged at noon was not visible to anyone until the next 11:00 UTC cron --
  # the repository and the live site disagreed for up to a day.
  #
  # Gated on `needs: test`, so a push that breaks the suite never reaches the
  # page. Pull requests do not deploy.
  deploy:
    needs: test
    # Manual runs publish too. Gating on `push` alone left no way to deploy
    # when a push trigger is slow to fire -- GitHub queued one for 25 minutes
    # on 2026-08-26 -- and dispatching CI by hand then ran the tests and
    # skipped the publish, which is the opposite of what you want in that
    # moment. Pull requests still never deploy.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
