name: Daily forecast

# Refits the model against the latest polling, regenerates the dashboard data
# and the day-over-day commentary, commits the result, and redeploys Pages.
#
# The commit step matters more than it looks: `outputs/runs/<date>/forecast.json`
# is what the next run diffs against to write its commentary, and
# `site/data/history.json` is the trend line. Without persisting them, every run
# would believe it was the first.

on:
  schedule:
    # 11:00 UTC — after most pollsters have published for the day in the US.
    # Cron on GitHub Actions is best-effort and can be delayed under load.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Run the model and commit, but do not deploy to Pages"
        type: boolean
        default: false

permissions:
  contents: write      # commit regenerated forecast data
  pages: write         # deploy the dashboard
  id-token: write      # required by actions/deploy-pages

# Never let two runs fight over the same commit or deployment.
concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the commit step can push cleanly.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Check the candidate roster still covers the feed
        # Non-fatal: a new nominee means some polls are skipped, which we want
        # surfaced in the log, but it must not stop the forecast from running.
        continue-on-error: true
        run: python -m midterms.cli audit-roster

      - name: Run the forecast
        env:
          # We sample with nutpie (Numba); the PyTensor C backend is unused.
          PYTENSOR_FLAGS: "cxx="
        run: python -m midterms.cli run --quiet-sampler

      - name: Commit regenerated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/data/forecast.json \
                  site/data/history.json \
                  site/data/commentary.json \
                  outputs/runs \
                  CHANGELOG.md

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Forecast update $(date -u +%Y-%m-%d)"
            # Another run may have landed while we were sampling.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Runs after the commit step on purpose: the stamped index.html is for
      # the deploy artifact only and must not be committed, or the repo would
      # carry a hash that goes stale the next time a script changes.
      - name: Pin asset URLs to their contents
        if: ${{ !inputs.skip_deploy }}
        run: midterms -v stamp-assets

      - name: Configure Pages
        if: ${{ !inputs.skip_deploy }}
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        if: ${{ !inputs.skip_deploy }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: forecast
    if: ${{ !inputs.skip_deploy }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
