[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midterms-forecast"
version = "0.1.0"
description = "Hierarchical Bayesian forecasting model for the 2026 U.S. midterm elections"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Version bounds live here; the exact reproducible pin-set is requirements.txt.
dependencies = [
    "pymc>=5.16,<6",
    "arviz>=0.18",
    "nutpie>=0.13",
    "numba>=0.60",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pandas>=2.1",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
midterms = "midterms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::FutureWarning:arviz.*",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Analysis scripts silence warnings and configure logging before importing the
# heavy scientific stack, which necessarily puts imports after statements.
"scripts/*.py" = ["E402"]
