# =============================================================================
# 2026 U.S. Senate — race definitions
# =============================================================================
# This file is the single source of truth for WHICH contests exist and what
# structural (non-poll) information we know about them. The model reads it; no
# race information is hard-coded in Python.
#
# The schema here is deliberately chamber-agnostic. Adding the House or the
# governorships later means adding config/races_house_2026.yaml with the same
# keys (`district` replacing `state` as the unit id) — not editing the model.
#
# FIELD NOTES
#   id                        stable unique key, used in all output JSON
#   unit                      geographic unit (state postal code here)
#   special                   true for the two 2026 special elections
#   incumbent_party           party currently holding the seat: D | R
#   incumbent_status          elected  -> elected incumbent is on the ballot
#                             appointed-> appointed incumbent is on the ballot
#                             open     -> no incumbent on the ballot
#   pres_2024_dem_two_party   Harris / (Harris + Trump), statewide
#   pres_2020_dem_two_party   Biden  / (Biden  + Trump), statewide
#   region                    used to build the state-error correlation kernel
#
# The two presidential columns are approximate two-party shares (±0.005). They
# are anchors for the fundamentals prior, which carries a deliberately wide SD,
# so this precision is sufficient. See docs/DATA_SOURCES.md.
# =============================================================================

cycle: 2026
chamber: senate
election_date: 2026-11-03

# ---------------------------------------------------------------------------
# Chamber control arithmetic.
#
# Current Senate: 53 R, 45 D, 2 I (both caucus with Democrats) = 100.
# 35 seats are up in 2026: 33 Class 2 regular + FL and OH specials.
#   Republican-held seats up: 22   ->  53 - 22 = 31 R not up
#   Democratic-held seats up: 13   ->  47 - 13 = 34 D not up  (incl. the 2 I)
# Vice President Vance breaks ties, so Republicans hold the chamber at 50-50:
# Democrats need 51 seats, Republicans need 50.
#
# tests/test_config.py asserts this arithmetic closes to 100 and that the
# per-race `incumbent_party` counts match `seats_up` below.
# ---------------------------------------------------------------------------
control:
  total_seats: 100
  seats_not_up:
    D: 34
    R: 31
  seats_up:
    D: 13
    R: 22
  dem_seats_for_majority: 51
  rep_seats_for_majority: 50
  tiebreaker_party: R

races:
  # ---- Republican-held seats up -------------------------------------------
