    unit: AL
    name: Alabama
    special: false
    incumbent_party: R
    incumbent_status: open          # Tuberville retired to run for Governor
    pres_2024_dem_two_party: 0.342
    pres_2020_dem_two_party: 0.373
    region: south

  - id: senate-2026-AK
